name: Fetch CSVs from external repo → Release assets

on:
  push:
    branches:
      - feature/deploy-data
  workflow_dispatch:

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout external repo
        uses: actions/checkout@v4
        with:
          repository: openTdataCH/showcases
          ref: develop
          path: openTdataCH--showcases
          fetch-depth: 1

      - name: Show folder structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Repo contents:"
          ls -al

      - name: Recursively list everything
        run: |
          echo "Recursive listing of all folders:"
          find . -type d | while read d; do
            echo "--- $d ---"
            ls -al "$d"
          done