name: Fetch CSVs from external repo → Release assets

on:
  push:
    branches:
      - feature/deploy-data
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false # queue instead of cancel

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout external repo
        uses: actions/checkout@v4
        with:
          repository: openTdataCH/showcases
          # ref: develop
          ref: feature/fix-fetch-atlas-package
          path: openTdataCH--showcases
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: openTdataCH--showcases/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip 
          pip install -r openTdataCH--showcases/requirements.txt
          
      - name: Prepare fetch folders
        run: |
          python3 openTdataCH--showcases/tools/scripts/setup.py

      - name: Override .env values
        run: |
          echo "OTD_KEY=${{ secrets.OTD_KEY }}" >> $GITHUB_ENV

      - name: Fetch train formation
        run: |
          bash fetch-train-formation.sh

      - name: Show dist contents
        run: |
          echo "=== dist listing ==="
          ls -lah dist || true

      - name: Upload to Release tag 'latest'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: occupancy-forecast-json-dataset-latest
          release_name: occupancy-forecast-json-dataset latest
          body: 'Automated dataset publish'
          file: dist/**/*
          file_glob: true
          overwrite: true
          draft: false
          prerelease: false
