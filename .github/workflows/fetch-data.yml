name: Fetch CSVs from external repo → Release assets

on:
  push:
    branches:
      - feature/deploy-data
  workflow_dispatch:

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout external repo
        uses: actions/checkout@v4
        with:
          repository: openTdataCH/showcases
          ref: develop
          path: openTdataCH--showcases
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: openTdataCH--showcases/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip 
          pip install -r openTdataCH--showcases/requirements.txt
